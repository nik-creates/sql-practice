databases:
  - name: sqlpractice-db
    databaseName: sqlpractice
    plan: free

services:
  - type: web
    name: sql-practice
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sqlpractice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_USER
        sync: false
      - key: APP_PASS_HASH
        sync: false
      - key: MYSQL_URL
        sync: false
