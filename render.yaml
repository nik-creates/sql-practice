databases:
  - name: sqlpractice-db
    databaseName: sqlpractice
    plan: free

services:
  - type: web
    name: sql-practice
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sqlpractice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_USER
        sync: false
      - key: APP_PASS_HASH
        sync: false
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_PASSWORD
        generateValue: true
